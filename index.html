<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>미니 게임 허브</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #1a1a2e;
      color: #eee;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 80px 20px 40px;
    }

    h1 {
      font-size: 2.4rem;
      margin-bottom: 10px;
      color: #f0c040;
      letter-spacing: -0.5px;
    }

    .subtitle {
      color: #888;
      margin-bottom: 56px;
      font-size: 0.95rem;
    }

    .game-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      width: 100%;
      max-width: 560px;
    }

    .game-card {
      background: #16213e;
      border: 2px solid #0f3460;
      border-radius: 20px;
      padding: 40px 24px;
      text-align: center;
      text-decoration: none;
      color: #eee;
      transition: transform 0.15s, border-color 0.2s, box-shadow 0.2s;
    }

    .game-card:hover {
      transform: translateY(-6px);
      border-color: #f0c040;
      box-shadow: 0 10px 28px rgba(240, 192, 64, 0.18);
    }

    .game-card .icon {
      font-size: 3.6rem;
      display: block;
      margin-bottom: 18px;
    }

    .game-card h2 {
      font-size: 1.3rem;
      margin-bottom: 10px;
      color: #f0c040;
    }

    .game-card p {
      font-size: 0.85rem;
      color: #777;
      line-height: 1.6;
    }

    .contact-link {
      margin-top: 36px;
      color: #556;
      font-size: 0.85rem;
      text-decoration: none;
      border-bottom: 1px solid #334;
      padding-bottom: 2px;
      transition: color 0.15s, border-color 0.15s;
    }
    .contact-link:hover { color: #f0c040; border-color: #f0c040; }

    .comments-section {
      width: 100%;
      max-width: 720px;
      margin-top: 60px;
      border-top: 1px solid #0f3460;
      padding-top: 40px;
    }

    .comments-title {
      font-size: 1rem;
      color: #f0c040;
      margin-bottom: 24px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    /* Disqus 다크 배경 맞춤 */
    #disqus_thread { color-scheme: dark; }
  </style>
</head>
<body>
  <h1>🎮 미니 게임 허브</h1>
  <p class="subtitle">플레이할 게임을 선택하세요</p>

  <div class="game-grid">
    <a href="lotto.html" class="game-card">
      <span class="icon">🎱</span>
      <h2>로또 게임</h2>
      <p>1~45 중 6개 번호를<br>자동 추첨합니다</p>
    </a>
    <a href="ladder.html" class="game-card">
      <span class="icon">🪜</span>
      <h2>사다리 게임</h2>
      <p>공정한 사다리로<br>결과를 결정합니다</p>
    </a>
  </div>

  <a href="contact.html" class="contact-link">제휴 문의</a>

  <section class="comments-section">
    <p class="comments-title">댓글</p>
    <div id="disqus_thread"></div>
    <script>
      var disqus_config = function () {
        this.page.url = 'https://umfanet.github.io/study/';
        this.page.identifier = 'mini-game-hub-index';
      };
      (function() {
        var d = document, s = d.createElement('script');
        s.src = 'https://umfastudy.disqus.com/embed.js';
        s.setAttribute('data-timestamp', +new Date());
        (d.head || d.body).appendChild(s);
      })();
    </script>
    <noscript>댓글을 보려면 JavaScript를 활성화해주세요. (<a href="https://disqus.com/?ref_noscript">Disqus</a>)</noscript>
  </section>
</body>
</html>
