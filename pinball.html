<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>핀볼 랜덤 뽑기</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #1a1a2e;
      color: #eee;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 24px 16px 60px;
    }

    .back-link {
      align-self: flex-start;
      margin-bottom: 20px;
      color: #888;
      text-decoration: none;
      font-size: 0.9rem;
    }
    .back-link:hover { color: #f0c040; }

    h1 { font-size: 1.8rem; margin-bottom: 4px; color: #f0c040; }
    .subtitle { color: #888; margin-bottom: 20px; font-size: 0.85rem; }

    .layout {
      display: flex;
      gap: 16px;
      width: 100%;
      max-width: 900px;
      align-items: flex-start;
    }

    .sidebar {
      width: 220px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card {
      background: #16213e;
      border: 1px solid #0f3460;
      border-radius: 14px;
      padding: 16px;
    }

    .card-title {
      font-size: 0.72rem;
      color: #f0c040;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      margin-bottom: 10px;
    }

    textarea {
      width: 100%;
      background: #0f3460;
      border: 1px solid #1a4080;
      border-radius: 8px;
      color: #eee;
      font-size: 0.85rem;
      padding: 8px;
      resize: vertical;
      min-height: 130px;
      outline: none;
      line-height: 1.6;
    }
    textarea:focus { border-color: #f0c040; }

    .hint {
      font-size: 0.7rem;
      color: #555;
      margin-top: 6px;
      line-height: 1.5;
    }

    /* Map selector */
    .map-btns {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .map-btn {
      padding: 7px 10px;
      border-radius: 8px;
      border: 1px solid #1a4080;
      background: #0f3460;
      color: #aaa;
      font-size: 0.8rem;
      cursor: pointer;
      text-align: left;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }
    .map-btn.active {
      background: #f0c040;
      color: #1a1a2e;
      border-color: #f0c040;
      font-weight: 700;
    }
    .map-btn:hover:not(.active) { border-color: #f0c040; color: #f0c040; }

    /* Skill toggle */
    .toggle-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.82rem;
    }
    .toggle {
      position: relative;
      width: 40px;
      height: 22px;
      flex-shrink: 0;
    }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute;
      inset: 0;
      background: #0f3460;
      border-radius: 22px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .slider:before {
      content: '';
      position: absolute;
      width: 16px; height: 16px;
      left: 3px; top: 3px;
      background: #aaa;
      border-radius: 50%;
      transition: transform 0.2s, background 0.2s;
    }
    input:checked + .slider { background: #2a6040; }
    input:checked + .slider:before { transform: translateX(18px); background: #40e090; }

    /* Action buttons */
    .action-btns { display: flex; flex-direction: column; gap: 8px; }

    .btn {
      width: 100%;
      padding: 11px;
      border-radius: 10px;
      border: none;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
    }
    .btn:active { transform: scale(0.97); }
    .btn-shuffle { background: #0f3460; color: #aae; border: 1px solid #1a4080; }
    .btn-shuffle:hover { border-color: #aae; color: #ccf; }
    .btn-start { background: #f0c040; color: #1a1a2e; }
    .btn-start:hover { opacity: 0.9; }
    .btn-stop { background: #c04040; color: #fff; display: none; }
    .btn-stop:hover { opacity: 0.9; }
    .btn-reset { background: #16213e; color: #888; border: 1px solid #0f3460; }
    .btn-reset:hover { color: #eee; }

    /* Canvas area */
    .canvas-wrap {
      flex: 1;
      position: relative;
    }

    canvas {
      display: block;
      width: 100%;
      border-radius: 14px;
      border: 1px solid #0f3460;
      background: #0b1020;
    }

    /* Result overlay */
    .result-overlay {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(10, 14, 30, 0.88);
      border-radius: 14px;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }
    .result-overlay.show { display: flex; }
    .result-title { font-size: 1rem; color: #aaa; margin-bottom: 10px; }
    .result-winner {
      font-size: 2.2rem;
      font-weight: 900;
      color: #f0c040;
      text-shadow: 0 0 24px rgba(240,192,64,0.7);
      margin-bottom: 6px;
      text-align: center;
      padding: 0 16px;
    }
    .result-rank {
      font-size: 0.82rem;
      color: #777;
      max-width: 90%;
      text-align: center;
      line-height: 1.7;
      margin-top: 8px;
    }
    .btn-close-result {
      margin-top: 20px;
      padding: 10px 28px;
      background: #f0c040;
      color: #1a1a2e;
      border: none;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
    }
    .btn-close-result:hover { opacity: 0.88; }

    @media (max-width: 640px) {
      .layout { flex-direction: column; }
      .sidebar { width: 100%; }
    }
  </style>
</head>
<body>
  <a href="index.html" class="back-link">← 게임 허브로</a>
  <h1>🎱 핀볼 랜덤 뽑기</h1>
  <p class="subtitle">핀볼 기계로 무작위 우승자를 결정하세요</p>

  <div class="layout">
    <!-- Sidebar -->
    <div class="sidebar">
      <div class="card">
        <div class="card-title">참가자 이름 입력</div>
        <textarea id="namesInput" placeholder="철수&#10;영희&#10;민준&#10;지아&#10;태양"></textarea>
        <div class="hint">
          줄바꿈으로 구분 · 이름 뒤 숫자로 공 갯수 (예: 철수2)<br>
          이름/숫자로 가중치 설정 (예: 짱구/3)
        </div>
      </div>

      <div class="card">
        <div class="card-title">맵 선택</div>
        <div class="map-btns">
          <button class="map-btn active" data-map="wheel">🎡 운명의 수레바퀴</button>
          <button class="map-btn" data-map="bubble">🫧 버블</button>
          <button class="map-btn" data-map="jar">🏺 욕망의 항아리</button>
        </div>
      </div>

      <div class="card">
        <div class="card-title">스킬 · 옵션</div>
        <div class="toggle-row">
          <label class="toggle">
            <input type="checkbox" id="skillToggle">
            <span class="slider"></span>
          </label>
          <span>밀치기 스킬 활성화</span>
        </div>
      </div>

      <div class="card action-btns">
        <button class="btn btn-shuffle" id="btnShuffle">🔀 섞기</button>
        <button class="btn btn-start" id="btnStart">▶ 시작</button>
        <button class="btn btn-stop" id="btnStop">⏹ 정지</button>
        <button class="btn btn-reset" id="btnReset">↺ 초기화</button>
      </div>
    </div>

    <!-- Canvas -->
    <div class="canvas-wrap">
      <canvas id="pinball" width="520" height="620"></canvas>
      <div class="result-overlay" id="resultOverlay">
        <div class="result-title">🏆 우승자 발표!</div>
        <div class="result-winner" id="resultWinner"></div>
        <div class="result-rank" id="resultRank"></div>
        <button class="btn-close-result" id="btnCloseResult">닫기</button>
      </div>
    </div>
  </div>

  <script>
  (() => {
    const canvas = document.getElementById('pinball');
    const ctx = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height;

    // ── State ──────────────────────────────────────────────
    let balls = [];
    let pins = [];
    let goals = [];
    let particles = [];
    let animId = null;
    let running = false;
    let finished = false;
    let currentMap = 'wheel';
    let skillEnabled = false;
    let skillTimer = 0;
    let shuffling = false;
    let rankList = [];   // finish order

    const BALL_R = 13;
    const GOAL_Y = H - 36;

    // ── Colour palette ────────────────────────────────────
    const PALETTE = [
      '#e84040','#f0a020','#40c040','#4080f0','#c040c0',
      '#40c0c0','#f06040','#a0e040','#4040e0','#e04080',
      '#80e0a0','#f0e040','#40a0e0','#e06000','#6040c0',
    ];

    // ── Parse input ───────────────────────────────────────
    function parseNames() {
      const raw = document.getElementById('namesInput').value.trim();
      if (!raw) return [{name:'공1',weight:1},{name:'공2',weight:1},{name:'공3',weight:1}];
      const lines = raw.split('\n').map(l => l.trim()).filter(Boolean);
      const result = [];
      lines.forEach(line => {
        // weight: name/3
        const wMatch = line.match(/^(.+?)\/(\d+)$/);
        if (wMatch) {
          const n = wMatch[1].trim(), w = parseInt(wMatch[2]);
          for (let i = 0; i < w; i++) result.push({name: n + (w>1?`(${i+1})`:''), weight:1});
          return;
        }
        // count: name2 or name*2
        const cMatch = line.match(/^(.+?)[\*×]?(\d+)$/);
        if (cMatch && parseInt(cMatch[2]) > 0 && parseInt(cMatch[2]) <= 20) {
          const n = cMatch[1].trim(), cnt = parseInt(cMatch[2]);
          for (let i = 0; i < cnt; i++) result.push({name: n + (cnt>1?`${i+1}`:''), weight:1});
          return;
        }
        result.push({name: line, weight:1});
      });
      return result.slice(0, 20);
    }

    // ── Build pins by map ─────────────────────────────────
    function buildPins(map) {
      pins = [];
      if (map === 'wheel') {
        // Grid of pins with staggered rows
        for (let row = 0; row < 9; row++) {
          const cols = (row % 2 === 0) ? 7 : 6;
          const offsetX = (row % 2 === 0) ? 40 : 70;
          for (let col = 0; col < cols; col++) {
            pins.push({
              x: offsetX + col * 65,
              y: 100 + row * 52,
              r: 6
            });
          }
        }
      } else if (map === 'bubble') {
        // Scattered circular clusters
        const centers = [
          {cx:130,cy:180},{cx:260,cy:140},{cx:390,cy:180},
          {cx:80,cy:310},{cx:200,cy:280},{cx:330,cy:300},{cx:440,cy:270},
          {cx:150,cy:430},{cx:290,cy:400},{cx:410,cy:420},
        ];
        centers.forEach(({cx,cy}) => {
          for (let a = 0; a < 6; a++) {
            const angle = (a / 6) * Math.PI * 2;
            pins.push({x: cx + Math.cos(angle)*36, y: cy + Math.sin(angle)*36, r:5});
          }
          pins.push({x:cx, y:cy, r:7});
        });
      } else { // jar
        // Funnel shape
        for (let row = 0; row < 8; row++) {
          const spread = 60 + row * 30;
          const cols = 3 + row;
          for (let col = 0; col < cols; col++) {
            const x = (W/2) - spread/2 + (col / Math.max(cols-1,1)) * spread;
            pins.push({x, y: 90 + row * 58, r: 5 + (row < 3 ? 2 : 0)});
          }
        }
      }
    }

    // ── Build goal slots ──────────────────────────────────
    function buildGoals(count) {
      goals = [];
      const slotW = W / count;
      for (let i = 0; i < count; i++) {
        goals.push({
          x: i * slotW,
          w: slotW,
          label: String(i + 1),
          reached: false
        });
      }
    }

    // ── Create balls ──────────────────────────────────────
    function createBalls(entries) {
      const count = entries.length;
      const slotW = W / count;
      balls = entries.map((entry, i) => ({
        x: slotW * i + slotW / 2 + (Math.random()-0.5)*10,
        y: 30 + Math.random() * 10,
        vx: (Math.random()-0.5) * 2,
        vy: 0,
        r: BALL_R,
        color: PALETTE[i % PALETTE.length],
        name: entry.name,
        finished: false,
        rank: 0,
        alpha: 1,
      }));
    }

    // ── Physics step ──────────────────────────────────────
    const GRAVITY = 0.28;
    const DAMPING = 0.62;
    const FRICTION = 0.993;

    function step() {
      const active = balls.filter(b => !b.finished);

      // skill: push
      if (skillEnabled && active.length > 1) {
        skillTimer++;
        if (skillTimer % 120 === 0) {
          // pick two random balls, push them apart
          const a = active[Math.floor(Math.random()*active.length)];
          const b = active[Math.floor(Math.random()*active.length)];
          if (a !== b) {
            const dx = b.x - a.x, dy = b.y - a.y;
            const d = Math.hypot(dx, dy) || 1;
            const force = 5;
            a.vx -= dx/d*force; a.vy -= dy/d*force;
            b.vx += dx/d*force; b.vy += dy/d*force;
          }
        }
      }

      balls.forEach(ball => {
        if (ball.finished) return;

        ball.vy += GRAVITY;
        ball.vx *= FRICTION;
        ball.x += ball.vx;
        ball.y += ball.vy;

        // Wall bounce
        if (ball.x - ball.r < 0) { ball.x = ball.r; ball.vx = Math.abs(ball.vx) * DAMPING; }
        if (ball.x + ball.r > W) { ball.x = W - ball.r; ball.vx = -Math.abs(ball.vx) * DAMPING; }

        // Pin collision
        pins.forEach(pin => {
          const dx = ball.x - pin.x, dy = ball.y - pin.y;
          const dist = Math.hypot(dx, dy);
          const minDist = ball.r + pin.r;
          if (dist < minDist && dist > 0) {
            const nx = dx/dist, ny = dy/dist;
            ball.x = pin.x + nx * minDist;
            ball.y = pin.y + ny * minDist;
            const dot = ball.vx*nx + ball.vy*ny;
            ball.vx = (ball.vx - 2*dot*nx) * DAMPING + (Math.random()-0.5)*1.5;
            ball.vy = (ball.vy - 2*dot*ny) * DAMPING;
          }
        });

        // Ball-ball collision
        balls.forEach(other => {
          if (other === ball || other.finished) return;
          const dx = ball.x - other.x, dy = ball.y - other.y;
          const dist = Math.hypot(dx, dy);
          const minDist = ball.r + other.r;
          if (dist < minDist && dist > 0) {
            const nx = dx/dist, ny = dy/dist;
            const overlap = (minDist - dist) / 2;
            ball.x += nx * overlap; ball.y += ny * overlap;
            other.x -= nx * overlap; other.y -= ny * overlap;
            const dot = (ball.vx-other.vx)*nx + (ball.vy-other.vy)*ny;
            if (dot < 0) {
              ball.vx -= dot*nx*0.7; ball.vy -= dot*ny*0.7;
              other.vx += dot*nx*0.7; other.vy += dot*ny*0.7;
            }
          }
        });

        // Goal detection
        if (ball.y + ball.r >= GOAL_Y) {
          ball.finished = true;
          ball.y = GOAL_Y - ball.r;
          ball.vx = 0; ball.vy = 0;
          rankList.push(ball);
          ball.rank = rankList.length;
          spawnParticles(ball.x, ball.y, ball.color);

          // Mark goal slot
          goals.forEach(g => {
            if (ball.x >= g.x && ball.x < g.x + g.w && !g.reached) {
              g.reached = true;
              g.winner = ball.name;
            }
          });

          // Check end
          const remaining = balls.filter(b => !b.finished);
          if (remaining.length === 0) endGame();
        }
      });

      // Particles
      particles.forEach(p => {
        p.x += p.vx; p.y += p.vy;
        p.vy += 0.12;
        p.life -= 0.025;
      });
      particles = particles.filter(p => p.life > 0);
    }

    function spawnParticles(x, y, color) {
      for (let i = 0; i < 20; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 2 + Math.random() * 4;
        particles.push({
          x, y,
          vx: Math.cos(angle)*speed,
          vy: Math.sin(angle)*speed - 3,
          color,
          life: 1,
          r: 2 + Math.random()*3,
        });
      }
    }

    // ── Draw ──────────────────────────────────────────────
    function draw() {
      ctx.clearRect(0, 0, W, H);

      // Background gradient
      const bg = ctx.createLinearGradient(0,0,0,H);
      bg.addColorStop(0, '#0b0e1a');
      bg.addColorStop(1, '#0b1428');
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, W, H);

      // Map decoration
      drawMapDeco();

      // Goal line
      ctx.strokeStyle = '#f0c04060';
      ctx.lineWidth = 1;
      ctx.setLineDash([6,4]);
      ctx.beginPath();
      ctx.moveTo(0, GOAL_Y); ctx.lineTo(W, GOAL_Y);
      ctx.stroke();
      ctx.setLineDash([]);

      // Goal slots
      goals.forEach((g, i) => {
        ctx.fillStyle = g.reached ? '#f0c04018' : '#ffffff06';
        ctx.fillRect(g.x+1, GOAL_Y, g.w-2, H-GOAL_Y);
        ctx.fillStyle = g.reached ? '#f0c040' : '#444';
        ctx.font = '10px Segoe UI';
        ctx.textAlign = 'center';
        ctx.fillText(g.label, g.x + g.w/2, H - 10);
      });

      // Pins
      pins.forEach(pin => {
        ctx.beginPath();
        ctx.arc(pin.x, pin.y, pin.r, 0, Math.PI*2);
        ctx.fillStyle = '#3060a0';
        ctx.fill();
        ctx.strokeStyle = '#6090d0';
        ctx.lineWidth = 1;
        ctx.stroke();
      });

      // Particles
      particles.forEach(p => {
        ctx.globalAlpha = p.life;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
        ctx.fillStyle = p.color;
        ctx.fill();
      });
      ctx.globalAlpha = 1;

      // Balls
      balls.forEach(ball => {
        // Shadow
        ctx.beginPath();
        ctx.arc(ball.x+2, ball.y+3, ball.r, 0, Math.PI*2);
        ctx.fillStyle = 'rgba(0,0,0,0.4)';
        ctx.fill();

        // Ball
        const grad = ctx.createRadialGradient(ball.x-3, ball.y-3, 1, ball.x, ball.y, ball.r);
        grad.addColorStop(0, lighten(ball.color, 60));
        grad.addColorStop(1, ball.color);
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI*2);
        ctx.fillStyle = grad;
        ctx.fill();

        // Label
        ctx.fillStyle = '#fff';
        ctx.font = `bold ${ball.r > 11 ? 9 : 7}px Segoe UI`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        const label = ball.name.length > 4 ? ball.name.slice(0,3)+'…' : ball.name;
        ctx.fillText(label, ball.x, ball.y);
        ctx.textBaseline = 'alphabetic';

        // Rank badge if finished
        if (ball.finished && ball.rank <= 3) {
          const medals = ['🥇','🥈','🥉'];
          ctx.font = '14px serif';
          ctx.fillText(medals[ball.rank-1], ball.x, ball.y - ball.r - 4);
        }
      });
    }

    function drawMapDeco() {
      if (currentMap === 'wheel') {
        // Subtle arcs
        ctx.strokeStyle = '#1a3060';
        ctx.lineWidth = 1;
        for (let i = 1; i <= 3; i++) {
          ctx.beginPath();
          ctx.arc(W/2, -20, 120*i, 0, Math.PI);
          ctx.stroke();
        }
      } else if (currentMap === 'bubble') {
        // Bubbles bg
        ctx.strokeStyle = '#1a2a50';
        ctx.lineWidth = 1;
        [[80,200,60],[320,160,80],[440,320,50],[160,400,70],[280,460,40]].forEach(([x,y,r]) => {
          ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.stroke();
        });
      } else {
        // Jar outline
        ctx.strokeStyle = '#1a3060';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(60, 60);
        ctx.bezierCurveTo(40, 300, 30, 450, 60, GOAL_Y);
        ctx.lineTo(W-60, GOAL_Y);
        ctx.bezierCurveTo(W-30, 450, W-40, 300, W-60, 60);
        ctx.stroke();
      }
    }

    function lighten(hex, amt) {
      let r = parseInt(hex.slice(1,3),16);
      let g = parseInt(hex.slice(3,5),16);
      let b = parseInt(hex.slice(5,7),16);
      return `rgb(${Math.min(255,r+amt)},${Math.min(255,g+amt)},${Math.min(255,b+amt)})`;
    }

    // ── Game loop ─────────────────────────────────────────
    function loop() {
      if (!running) return;
      step();
      draw();
      animId = requestAnimationFrame(loop);
    }

    // ── Shuffle animation ─────────────────────────────────
    function doShuffle() {
      if (running) return;
      shuffling = true;
      buildState();
      let t = 0;
      const dur = 60;
      function shuffleFrame() {
        t++;
        balls.forEach(b => {
          b.x += (Math.random()-0.5)*6;
          b.y += (Math.random()-0.5)*3;
          b.x = Math.max(b.r, Math.min(W-b.r, b.x));
          b.y = Math.max(b.r, Math.min(55, b.y));
        });
        draw();
        if (t < dur) requestAnimationFrame(shuffleFrame);
        else shuffling = false;
      }
      shuffleFrame();
    }

    // ── Build state ───────────────────────────────────────
    function buildState() {
      const entries = parseNames();
      buildPins(currentMap);
      buildGoals(entries.length);
      createBalls(entries);
      rankList = [];
      particles = [];
      skillTimer = 0;
      draw();
    }

    // ── End game ──────────────────────────────────────────
    function endGame() {
      running = false;
      cancelAnimationFrame(animId);
      document.getElementById('btnStart').style.display = '';
      document.getElementById('btnStop').style.display = 'none';
      draw();

      // Show result
      const winner = rankList[0];
      document.getElementById('resultWinner').textContent = winner ? winner.name : '?';
      const rankText = rankList.slice(1).map((b,i) => `${i+2}위: ${b.name}`).join(' · ');
      document.getElementById('resultRank').textContent = rankText;
      document.getElementById('resultOverlay').classList.add('show');
    }

    // ── Controls ──────────────────────────────────────────
    document.getElementById('btnShuffle').addEventListener('click', doShuffle);

    document.getElementById('btnStart').addEventListener('click', () => {
      if (running) return;
      buildState();
      running = true;
      finished = false;
      document.getElementById('btnStart').style.display = 'none';
      document.getElementById('btnStop').style.display = '';
      loop();
    });

    document.getElementById('btnStop').addEventListener('click', () => {
      running = false;
      cancelAnimationFrame(animId);
      document.getElementById('btnStart').style.display = '';
      document.getElementById('btnStop').style.display = 'none';
    });

    document.getElementById('btnReset').addEventListener('click', () => {
      running = false;
      cancelAnimationFrame(animId);
      document.getElementById('btnStart').style.display = '';
      document.getElementById('btnStop').style.display = 'none';
      document.getElementById('resultOverlay').classList.remove('show');
      buildState();
    });

    document.getElementById('btnCloseResult').addEventListener('click', () => {
      document.getElementById('resultOverlay').classList.remove('show');
    });

    document.querySelectorAll('.map-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.map-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentMap = btn.dataset.map;
        if (!running) buildState();
      });
    });

    document.getElementById('skillToggle').addEventListener('change', e => {
      skillEnabled = e.target.checked;
    });

    // ── Default names ─────────────────────────────────────
    document.getElementById('namesInput').value = '철수\n영희\n민준\n지아\n태양';

    // ── Init ──────────────────────────────────────────────
    buildState();
  })();
  </script>
</body>
</html>
