<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로또 번호 생성기</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #1a1a2e;
      color: #eee;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 40px 20px;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 8px;
      color: #f0c040;
    }

    p.subtitle {
      color: #aaa;
      margin-bottom: 40px;
      font-size: 0.95rem;
    }

    .ticket {
      background: #16213e;
      border: 1px solid #0f3460;
      border-radius: 16px;
      padding: 24px 32px;
      margin-bottom: 16px;
      width: 100%;
      max-width: 480px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .ticket-label {
      font-size: 0.85rem;
      color: #888;
      min-width: 20px;
      text-align: center;
    }

    .balls {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .ball {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 1rem;
      color: #fff;
      flex-shrink: 0;
    }

    .ball.yellow  { background: #e5a823; }
    .ball.blue    { background: #4a90d9; }
    .ball.red     { background: #e74c3c; }
    .ball.gray    { background: #555; }
    .ball.green   { background: #27ae60; }

    #tickets-container {
      width: 100%;
      max-width: 480px;
    }

    .btn {
      margin-top: 24px;
      padding: 14px 40px;
      font-size: 1.1rem;
      font-weight: bold;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      background: #f0c040;
      color: #1a1a2e;
      transition: transform 0.1s, background 0.2s;
    }

    .btn:hover { background: #f5d060; }
    .btn:active { transform: scale(0.97); }

    .options {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 24px;
    }

    label { font-size: 0.9rem; color: #aaa; }

    select {
      padding: 6px 12px;
      border-radius: 8px;
      border: 1px solid #0f3460;
      background: #16213e;
      color: #eee;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>

  <h1>로또 번호 생성기</h1>
  <p class="subtitle">1~45 중 6개 번호를 자동 추첨합니다</p>

  <div class="options">
    <label for="count">게임 수:</label>
    <select id="count">
      <option value="1">1게임</option>
      <option value="3">3게임</option>
      <option value="5" selected>5게임</option>
      <option value="10">10게임</option>
    </select>
  </div>

  <div id="tickets-container"></div>

  <button class="btn" onclick="generate()">번호 생성</button>

  <script>
    function pickNumbers() {
      const pool = Array.from({ length: 45 }, (_, i) => i + 1);
      const picked = [];
      while (picked.length < 6) {
        const idx = Math.floor(Math.random() * pool.length);
        picked.push(pool.splice(idx, 1)[0]);
      }
      return picked.sort((a, b) => a - b);
    }

    function ballColor(n) {
      if (n <= 10) return 'yellow';
      if (n <= 20) return 'blue';
      if (n <= 30) return 'red';
      if (n <= 40) return 'gray';
      return 'green';
    }

    function generate() {
      const count = parseInt(document.getElementById('count').value);
      const container = document.getElementById('tickets-container');
      container.innerHTML = '';

      const labels = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H', 'I', 'J'];

      for (let i = 0; i < count; i++) {
        const nums = pickNumbers();
        const ticket = document.createElement('div');
        ticket.className = 'ticket';

        const label = document.createElement('div');
        label.className = 'ticket-label';
        label.textContent = labels[i];

        const balls = document.createElement('div');
        balls.className = 'balls';

        nums.forEach(n => {
          const ball = document.createElement('div');
          ball.className = `ball ${ballColor(n)}`;
          ball.textContent = n;
          balls.appendChild(ball);
        });

        ticket.appendChild(label);
        ticket.appendChild(balls);
        container.appendChild(ticket);
      }
    }

    // 초기 생성
    generate();
  </script>

</body>
</html>
